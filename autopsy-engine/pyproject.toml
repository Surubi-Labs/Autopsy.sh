[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopsy-engine"
version = "0.1.0"
description = "Git repository analysis engine for Autopsy"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["autopsy"]

[project.scripts]
autopsy-engine = "autopsy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.14",
]
