spring:
  application:
    name: autopsy-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autopsy}
    username: ${POSTGRES_USER:autopsy}
    password: ${POSTGRES_PASSWORD:autopsy}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mvc:
    problemdetails:
      enabled: true

  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8080}

autopsy:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-secret-that-must-be-changed-in-production-256bits}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    team-price-id: ${STRIPE_TEAM_PRICE_ID:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/settings?billing=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/settings?billing=canceled}
